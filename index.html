<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management System - Customer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <h1>🍽️ Order Management System</h1>
        <p style="margin: 0; color: #ecf0f1; font-size: 14px;">Customer Portal</p>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Tab Navigation -->
    <div style="display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #ddd;">
      <button class="tab-btn" onclick="switchTab('browse')" style="background: none; border: none; padding: 15px 20px; font-size: 16px; color: #2c3e50; border-bottom: 3px solid #3498db; font-weight: bold;">
        Browse & Order
      </button>
      <button class="tab-btn" onclick="switchTab('tracking')" style="background: none; border: none; padding: 15px 20px; font-size: 16px; color: #7f8c8d; border-bottom: 3px solid transparent; font-weight: bold; cursor: pointer;">
        Track Order
      </button>
    </div>

    <!-- Browse & Order Tab -->
    <div id="browse-tab" class="tab-content">
      <!-- Product Categories -->
      <div style="margin-bottom: 30px;">
        <h2 style="color: #2c3e50; margin-bottom: 15px;">Select Category</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn-primary" onclick="showCategory('beverages')">☕ Beverages</button>
          <button class="btn-primary" onclick="showCategory('food')">🍔 Food</button>
          <button class="btn-primary" onclick="showCategory('desserts')">🍰 Desserts</button>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="products-grid" id="products-grid">
        <!-- Products will be loaded here -->
      </div>

      <!-- Cart & Checkout -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
        <div class="cart-section" style="grid-column: 1;">
          <h2>🛒 Shopping Cart</h2>
          <div class="cart-items-list" id="cart-items">
            <p style="color: #7f8c8d; text-align: center; padding: 20px;">Cart is empty</p>
          </div>
          <div class="cart-summary">
            <div class="total">Total: <span id="cart-total">$0.00</span></div>
            <button class="btn-danger btn-sm" onclick="clearCart()" style="width: 100%;">Clear Cart</button>
          </div>
        </div>

        <!-- Checkout Form -->
        <div class="checkout-form">
          <h2>💳 Checkout</h2>
          <div class="form-group">
            <label for="customer-name">Customer Name *</label>
            <input type="text" id="customer-name" placeholder="Enter your full name" required>
          </div>
          <div class="form-group">
            <label for="contact-number">Contact Number *</label>
            <input type="tel" id="contact-number" placeholder="Enter your phone number" required>
          </div>
          <div class="form-group">
            <label for="payment-method">Payment Method *</label>
            <select id="payment-method" required>
              <option value="">Select payment method</option>
              <option value="Cash">Cash</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="Digital Wallet">Digital Wallet</option>
            </select>
          </div>
          <button class="btn-success" onclick="placeOrder()" style="width: 100%; padding: 12px; font-size: 16px;">
            Place Order
          </button>
        </div>
      </div>

      <!-- Order Confirmation -->
      <div id="order-confirmation" style="display: none;">
        <div class="order-confirmation">
          <h3>✅ Order Placed Successfully!</h3>
          <div class="order-number" id="confirmation-order-number"></div>
          <p id="confirmation-message"></p>
          <button class="btn-primary" onclick="resetOrder()">Place Another Order</button>
        </div>
      </div>
    </div>

    <!-- Track Order Tab -->
    <div id="tracking-tab" class="tab-content" style="display: none;">
      <div class="tracking-section">
        <h2>📍 Track Your Order</h2>
        <div class="tracking-input">
          <input type="text" id="tracking-order-number" placeholder="Enter order number (e.g., ORD-1234567890)">
          <button class="btn-primary" onclick="trackOrder()">Search</button>
        </div>
        <div id="tracking-result"></div>
      </div>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="script.js"></script>
  <script>
    let currentCart = [];
    let currentCategory = 'beverages';

    // Initialize on page load
    window.addEventListener('load', () => {
      showCategory('beverages');
    });

    // Switch tabs
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.style.display = 'none';
      });
      document.getElementById(tabName + '-tab').style.display = 'block';

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.style.borderBottomColor = 'transparent';
        btn.style.color = '#7f8c8d';
      });
      event.target.style.borderBottomColor = '#3498db';
      event.target.style.color = '#2c3e50';
    }

    // Display products by category
    function showCategory(category) {
      currentCategory = category;
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      if (products[category]) {
        products[category].forEach(product => {
          const productCard = document.createElement('div');
          productCard.className = 'product-card';
          const imageHtml = product.image ? `<img src="${product.image}" alt="${product.name}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; background-color: #ecf0f1;">` : '';
          productCard.innerHTML = `
            ${imageHtml}
            <h3>${product.name}</h3>
            <div class="price">${formatCurrency(product.price)}</div>
            <input type="number" id="qty-${product.id}" value="0" min="0" max="100">
            <button class="btn-primary btn-sm" onclick="addToCart('${product.id}', '${product.name}', ${product.price})">
              Add to Cart
            </button>
          `;
          grid.appendChild(productCard);
        });
      }
    }

    // Add item to cart
    function addToCart(productId, productName, price) {
      const quantityInput = document.getElementById(`qty-${productId}`);
      const quantity = parseInt(quantityInput.value);

      if (quantity <= 0) {
        showNotification('Please enter a quantity greater than 0', 'warning');
        return;
      }

      const existingItem = currentCart.find(item => item.productId === productId);

      if (existingItem) {
        existingItem.quantity += quantity;
      } else {
        currentCart.push({
          productId,
          productName,
          quantity,
          price
        });
      }

      quantityInput.value = 0;
      updateCartDisplay();
      showNotification(`${productName} added to cart!`, 'success');
    }

    // Update cart display
    function updateCartDisplay() {
      const cartItems = document.getElementById('cart-items');
      const cartTotal = document.getElementById('cart-total');

      if (currentCart.length === 0) {
        cartItems.innerHTML = '<p style="color: #7f8c8d; text-align: center; padding: 20px;">Cart is empty</p>';
        cartTotal.textContent = '$0.00';
        return;
      }

      cartItems.innerHTML = '';
      let total = 0;

      currentCart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        const cartItem = document.createElement('div');
        cartItem.className = 'cart-item';
        cartItem.innerHTML = `
          <div class="cart-item-info">
            <strong>${item.productName}</strong>
            <small>Qty: ${item.quantity} × ${formatCurrency(item.price)}</small>
            <div class="cart-item-price">${formatCurrency(itemTotal)}</div>
          </div>
          <button class="btn-danger btn-sm" onclick="removeFromCart(${index})">Remove</button>
        `;
        cartItems.appendChild(cartItem);
      });

      cartTotal.textContent = formatCurrency(total);
    }

    // Remove from cart
    function removeFromCart(index) {
      currentCart.splice(index, 1);
      updateCartDisplay();
      showNotification('Item removed from cart', 'info');
    }

    // Clear cart
    function clearCart() {
      if (confirm('Are you sure you want to clear the cart?')) {
        currentCart = [];
        updateCartDisplay();
        showNotification('Cart cleared', 'info');
      }
    }

    // Place order
    function placeOrder() {
      const customerName = document.getElementById('customer-name').value.trim();
      const contactNumber = document.getElementById('contact-number').value.trim();
      const paymentMethod = document.getElementById('payment-method').value;

      // Validation
      if (!customerName) {
        showNotification('Please enter your name', 'error');
        return;
      }
      if (!contactNumber) {
        showNotification('Please enter your contact number', 'error');
        return;
      }
      if (!paymentMethod) {
        showNotification('Please select a payment method', 'error');
        return;
      }
      if (currentCart.length === 0) {
        showNotification('Your cart is empty', 'error');
        return;
      }

      // Create order
      const totalAmount = currentCart.reduce((total, item) => total + (item.price * item.quantity), 0);
      const order = orderManager.createOrder(customerName, contactNumber, currentCart, totalAmount, paymentMethod);

      // Show confirmation
      document.getElementById('order-confirmation').style.display = 'block';
      document.getElementById('confirmation-order-number').textContent = order.orderNumber;
      document.getElementById('confirmation-message').textContent = `Thank you for your order! Your order has been placed at ${order.createdAt}`;

      // Reset form
      document.getElementById('customer-name').value = '';
      document.getElementById('contact-number').value = '';
      document.getElementById('payment-method').value = '';

      showNotification('Order placed successfully!', 'success');
    }

    // Reset order form
    function resetOrder() {
      currentCart = [];
      updateCartDisplay();
      document.getElementById('order-confirmation').style.display = 'none';
      showCategory('beverages');
    }

    // Track order
    function trackOrder() {
      const orderNumber = document.getElementById('tracking-order-number').value.trim();
      const trackingResult = document.getElementById('tracking-result');

      if (!orderNumber) {
        trackingResult.innerHTML = '';
        return;
      }

      const order = orderManager.getOrderByNumber(orderNumber);

      if (!order) {
        trackingResult.innerHTML = '<p style="color: #e74c3c; text-align: center; padding: 20px; font-weight: bold;">Order not found</p>';
        return;
      }

      let itemsHtml = '';
      order.items.forEach(item => {
        itemsHtml += `<div class="order-card-item">• ${item.productName} × ${item.quantity}</div>`;
      });

      trackingResult.innerHTML = `
        <div class="order-details">
          <h3>${order.orderNumber}</h3>
          <div class="order-details-row">
            <strong>Customer:</strong>
            <span>${order.customerName}</span>
          </div>
          <div class="order-details-row">
            <strong>Contact:</strong>
            <span>${order.contactNumber}</span>
          </div>
          <div class="order-details-row">
            <strong>Items:</strong>
            <div style="margin-top: -5px;">
              ${itemsHtml}
            </div>
          </div>
          <div class="order-details-row">
            <strong>Total:</strong>
            <span>${formatCurrency(order.totalAmount)}</span>
          </div>
          <div class="order-details-row">
            <strong>Payment:</strong>
            <span>${order.paymentMethod}</span>
          </div>
          <div class="order-details-row">
            <strong>Ordered:</strong>
            <span>${order.createdAt}</span>
          </div>
          <div class="order-details-row">
            <strong>Status:</strong>
            <span><span class="status-badge status-${order.status.toLowerCase()}">${order.status}</span></span>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
