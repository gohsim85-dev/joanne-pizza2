<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management System - Staff</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-container">
      <h1>👨‍💼 Staff Portal</h1>
      <p>Enter PIN to access order management</p>
      <input type="password" id="pin-input" class="pin-input" placeholder="0000" maxlength="4" readonly>
      <div class="pin-buttons">
        <button class="pin-button" onclick="addPin('1')">1</button>
        <button class="pin-button" onclick="addPin('2')">2</button>
        <button class="pin-button" onclick="addPin('3')">3</button>
        <button class="pin-button" onclick="addPin('4')">4</button>
        <button class="pin-button" onclick="addPin('5')">5</button>
        <button class="pin-button" onclick="addPin('6')">6</button>
        <button class="pin-button" onclick="addPin('7')">7</button>
        <button class="pin-button" onclick="addPin('8')">8</button>
        <button class="pin-button" onclick="addPin('9')">9</button>
        <button class="pin-button" onclick="addPin('0')">0</button>
        <button class="pin-button delete" onclick="deletePin()">⌫ Delete</button>
        <button class="pin-button enter" onclick="submitPin()">Enter</button>
      </div>
      <div class="login-error" id="login-error" style="display: none;"></div>
    </div>
  </div>

  <!-- Staff Board -->
  <div id="staff-board" style="display: none;">
    <header>
      <div class="container">
        <div class="staff-header">
          <h1>📋 Staff Order Management</h1>
          <button class="btn-danger" onclick="logout()">🚪 Logout</button>
        </div>
      </div>
    </header>

    <div class="container">
      <!-- Kanban Board -->
      <div class="kanban-board" id="kanban-board">
        <!-- Columns will be generated by JavaScript -->
      </div>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="script.js"></script>
  <script>
    const STAFF_PIN = '1234';
    let currentPin = '';

    // PIN button handler
    function addPin(digit) {
      if (currentPin.length < 4) {
        currentPin += digit;
        updatePinDisplay();
      }
    }

    // Delete PIN handler
    function deletePin() {
      currentPin = currentPin.slice(0, -1);
      updatePinDisplay();
    }

    // Update PIN display
    function updatePinDisplay() {
      const pinInput = document.getElementById('pin-input');
      pinInput.value = '•'.repeat(currentPin.length) + '0'.repeat(4 - currentPin.length);
    }

    // Submit PIN
    function submitPin() {
      if (currentPin.length !== 4) {
        showLoginError('PIN must be 4 digits');
        return;
      }

      if (currentPin === STAFF_PIN) {
        // Correct PIN
        sessionStorage.setItem('staffLoggedIn', 'true');
        showStaffBoard();
      } else {
        // Wrong PIN
        showLoginError('Incorrect PIN');
        currentPin = '';
        updatePinDisplay();
      }
    }

    // Show login error
    function showLoginError(message) {
      const errorDiv = document.getElementById('login-error');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 3000);
    }

    // Show staff board
    function showStaffBoard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('staff-board').style.display = 'block';
      loadKanbanBoard();
    }

    // Logout
    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        sessionStorage.removeItem('staffLoggedIn');
        document.getElementById('staff-board').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        currentPin = '';
        updatePinDisplay();
        showNotification('Logged out successfully', 'info');
      }
    }

    // Load Kanban board
    function loadKanbanBoard() {
      const kanbanBoard = document.getElementById('kanban-board');
      kanbanBoard.innerHTML = '';

      const statuses = ['NEW', 'PREPARING', 'READY', 'COMPLETED'];

      statuses.forEach(status => {
        const column = document.createElement('div');
        column.className = `kanban-column ${status.toLowerCase()}`;

        column.innerHTML = `
          <h3>${getStatusLabel(status)}</h3>
          <div class="kanban-cards" id="column-${status}">
            <!-- Order cards will be loaded here -->
          </div>
        `;

        kanbanBoard.appendChild(column);
      });

      // Load orders for each status
      statuses.forEach(status => {
        const orders = orderManager.getOrdersByStatus(status);
        const columnCards = document.getElementById(`column-${status}`);

        if (orders.length === 0) {
          columnCards.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">No orders</p>';
        } else {
          orders.forEach(order => {
            const orderCard = createOrderCard(order);
            columnCards.appendChild(orderCard);
          });
        }
      });
    }

    // Get status label with emoji
    function getStatusLabel(status) {
      const labels = {
        'NEW': '🆕 New Orders',
        'PREPARING': '👨‍🍳 Preparing',
        'READY': '✅ Ready for Pickup',
        'COMPLETED': '✔️ Completed'
      };
      return labels[status] || status;
    }

    // Create order card
    function createOrderCard(order) {
      let itemsHtml = '';
      order.items.forEach(item => {
        itemsHtml += `<div class="order-card-item">• ${item.productName} ×${item.quantity}</div>`;
      });

      const card = document.createElement('div');
      card.className = `order-card ${order.status.toLowerCase()}`;
      card.innerHTML = `
        <h4>${order.orderNumber}</h4>
        <div class="order-card-info">
          <strong>👤 ${order.customerName}</strong><br>
          <strong>📞 ${order.contactNumber}</strong><br>
          <strong>💳 ${order.paymentMethod}</strong>
        </div>
        <div class="order-card-items">
          ${itemsHtml}
        </div>
        <div class="order-card-total">Total: ${formatCurrency(order.totalAmount)}</div>
        <div class="order-card-actions">
          ${order.status !== 'NEW' ? `<button class="btn-info btn-sm" onclick="updateOrderStatus('${order.orderNumber}', 'NEW')">← Back</button>` : ''}
          ${order.status === 'NEW' ? `<button class="btn-warning btn-sm" onclick="updateOrderStatus('${order.orderNumber}', 'PREPARING')">Start Preparing</button>` : ''}
          ${order.status === 'PREPARING' ? `<button class="btn-success btn-sm" onclick="updateOrderStatus('${order.orderNumber}', 'READY')">Mark Ready</button>` : ''}
          ${order.status === 'READY' ? `<button class="btn-success btn-sm" onclick="updateOrderStatus('${order.orderNumber}', 'COMPLETED')">Complete</button>` : ''}
        </div>
      `;

      return card;
    }

    // Update order status
    function updateOrderStatus(orderNumber, newStatus) {
      if (orderManager.updateOrderStatus(orderNumber, newStatus)) {
        showNotification(`Order ${orderNumber} moved to ${newStatus}`, 'success');
        loadKanbanBoard();
      } else {
        showNotification('Failed to update order', 'error');
      }
    }

    // Auto-refresh board every 5 seconds
    setInterval(() => {
      if (sessionStorage.getItem('staffLoggedIn')) {
        loadKanbanBoard();
      }
    }, 5000);

    // Check if already logged in
    window.addEventListener('load', () => {
      if (sessionStorage.getItem('staffLoggedIn')) {
        showStaffBoard();
      }
    });

    // Allow Enter key to submit PIN
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') {
        submitPin();
      }
    });
  </script>
</body>
</html>
